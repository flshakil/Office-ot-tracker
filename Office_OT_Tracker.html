<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office OT Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OT Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2F3273">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --navy:#2F3273;
  --indigo:#4D50A2;
  --gold:#F9DF77;
  --white:#FFFFFF;
  --bg:#F3F4FC;
  --card:#FFFFFF;
  --surf:#ECEEF9;
  --tx:#202354;
  --mut:#636796;
  --bd:#DCDFF2;
  --pri:#4D50A2;
  --pri2:#2F3273;
  --ok:#14804A;
  --bad:#C83232;
  --hol:#FEF6D6;
  --sh:0 4px 16px rgba(47,50,115,.07);
  --sh-sm:0 2px 8px rgba(47,50,115,.05);
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12142B;
    --card:#1B1E3D;
    --surf:#242852;
    --tx:#FFFFFF;
    --mut:#A7ABD3;
    --bd:#2F3273;
    --pri:#7C7FE0;
    --pri2:#4D50A2;
    --ok:#4CD395;
    --bad:#FF7E7E;
    --hol:rgba(249,223,119,.14);
    --sh:0 6px 22px rgba(6,7,22,.42);
    --sh-sm:0 2px 10px rgba(6,7,22,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12142B;
  --card:#1B1E3D;
  --surf:#242852;
  --tx:#FFFFFF;
  --mut:#A7ABD3;
  --bd:#2F3273;
  --pri:#7C7FE0;
  --pri2:#4D50A2;
  --ok:#4CD395;
  --bad:#FF7E7E;
  --hol:rgba(249,223,119,.14);
  --sh:0 6px 22px rgba(6,7,22,.42);
  --sh-sm:0 2px 10px rgba(6,7,22,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Noto Sans Bengali","Hind Siliguri",sans-serif;padding-bottom:calc(82px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:22px;font-weight:750;letter-spacing:-.35px;margin:4px 0 12px;display:flex;align-items:center;gap:9px;color:var(--tx)}
h1 .ic{color:var(--pri)}
:root[data-theme="dark"] h1 .ic{color:var(--gold)}
h2{font-size:16px;font-weight:700;margin:18px 0 10px;color:var(--tx)}
h3{margin:0 0 4px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--tx)}
h3 .ic{color:var(--pri)}
:root[data-theme="dark"] h3 .ic{color:var(--gold)}

.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:var(--sh-sm)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:13px;box-shadow:var(--sh-sm)}
.k small{color:var(--mut);display:block;font-size:12px}
.k b{font-size:19px;color:var(--tx)}
.k.w{grid-column:1/-1}

label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:10px 0 5px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--surf);border:1.5px solid var(--bd);border-radius:13px;padding:11px 13px;width:100%;min-height:46px;transition:border-color .18s,box-shadow .18s,background .18s,transform .12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px color-mix(in srgb,var(--indigo) 22%,transparent);background:var(--card)}
:root[data-theme="dark"] input:focus,:root[data-theme="dark"] select:focus,:root[data-theme="dark"] textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(249,223,119,.18)}

button{background:linear-gradient(135deg,var(--indigo),var(--navy));color:#fff;border:0;border-radius:14px;font-weight:650;cursor:pointer;box-shadow:0 3px 10px rgba(47,50,115,.22)}
button:active{transform:scale(.98)}
button.s{background:var(--card);color:var(--tx);border:1.5px solid var(--bd);box-shadow:none}
button.s:hover{border-color:var(--pri)}
button.d{background:var(--bad);color:#fff;box-shadow:0 3px 10px rgba(200,50,50,.22)}

.row{display:flex;gap:8px}.row>*{flex:1}
.msg{padding:11px 14px;border-radius:14px;margin:10px 0;font-size:14px;font-weight:500}
.msg.ok{background:color-mix(in srgb,var(--ok) 15%,var(--card));color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.msg.er{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.note{font-size:12px;color:var(--mut)}
.banner{background:var(--gold);color:var(--navy);font-weight:600;border-radius:14px;padding:9px 13px;font-size:13px;margin-bottom:12px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{background:none;color:var(--mut);border:0;border-radius:14px;font-size:11px;font-weight:600;padding:7px 2px;min-height:54px;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button.on{color:var(--navy);background:color-mix(in srgb,var(--indigo) 12%,transparent);font-weight:750}
:root[data-theme="dark"] nav button.on{color:var(--gold);background:rgba(249,223,119,.12)}
nav button.on .ic{stroke-width:2.5}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{min-height:58px;border:1px solid var(--bd);border-radius:12px;padding:4px;font-size:11px;background:var(--card);cursor:pointer;transition:border-color .15s,transform .12s}
.cal div:active{transform:scale(.96)}
.cal .h{min-height:0;border:0;text-align:center;color:var(--mut);font-weight:700;background:none;cursor:default}
.cal .t{outline:2px solid var(--indigo);outline-offset:-1px}
:root[data-theme="dark"] .cal .t{outline-color:var(--gold)}
.cal i{font-style:normal;display:block;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.P{color:var(--ok);font-weight:600}.A{color:var(--bad);font-weight:600}.L{color:#c98a12;font-weight:600}
:root[data-theme="dark"] .L{color:var(--gold)}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.45px;color:var(--mut);background:var(--surf)}
th,td{padding:9px 9px;border-bottom:1px solid var(--bd);text-align:left}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}

.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#2F3273 0%,#4D50A2 100%);color:#FFFFFF;border-radius:22px;padding:19px;margin-bottom:12px;box-shadow:0 8px 24px rgba(47,50,115,.26);border:1px solid rgba(255,255,255,.12)}
.hero::after{content:"";position:absolute;top:-38px;right:-38px;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle,rgba(249,223,119,.24) 0%,rgba(249,223,119,0) 70%);pointer-events:none}
.hero small{opacity:.88;display:block}
.hero b{font-size:28px;display:block;margin:2px 0;letter-spacing:-.4px}
.hero.est{background:linear-gradient(135deg,#252861 0%,#2F3273 55%,#4D50A2 100%);border:1.5px solid rgba(249,223,119,.45)}
.hero.est b{color:var(--gold)}
.hero.ot{background:linear-gradient(135deg,#F9DF77 0%,#F2D04E 100%);color:#2F3273;border:1px solid rgba(47,50,115,.14);box-shadow:0 6px 20px rgba(249,223,119,.25)}
.hero.ot::after{background:radial-gradient(circle,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 70%)}
.hero.ot small{opacity:.82;color:#2F3273;font-weight:600}

.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.key{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px 15px;margin-bottom:10px;box-shadow:var(--sh-sm)}
.bub{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}
.bub .ic{width:23px;height:23px}
.key small{color:var(--mut);display:block;font-size:12px;font-weight:500}
.key b{font-size:21px;letter-spacing:-.2px}

.more{background:var(--card);color:var(--pri);border:1.5px dashed var(--pri);box-shadow:none;display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 10px}
:root[data-theme="dark"] .more{color:var(--gold);border-color:rgba(249,223,119,.55)}

.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;padding:12px 4px;background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:600;box-shadow:var(--sh-sm)}
.qa .ic{color:var(--indigo)}
:root[data-theme="dark"] .qa .ic{color:var(--gold)}

.theme{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:14px 16px;margin-bottom:12px;text-align:left;font-weight:600;box-shadow:var(--sh-sm)}
.theme .tl{display:flex;align-items:center;gap:12px}.theme .tl .ic{width:26px;height:26px;color:var(--pri)}.theme small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.sw{width:52px;height:30px;border-radius:20px;background:var(--bd);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 4px rgba(0,0,0,.28);transition:left .2s}
.sw.on{background:var(--indigo)}
:root[data-theme="dark"] .sw.on{background:var(--gold)}
:root[data-theme="dark"] .sw.on i{background:var(--navy)}
.sw.on i{left:25px}

.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0}
.chip{padding:10px 0;font-size:13px;background:var(--surf);color:var(--tx);border:1.5px solid var(--bd);min-height:44px;box-shadow:none}
.chip.on{background:linear-gradient(135deg,var(--indigo),var(--navy));color:#FFFFFF;border-color:var(--indigo);box-shadow:0 2px 8px rgba(47,50,115,.25)}
:root[data-theme="dark"] .chip.on{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:750}

.opt{display:block;text-align:left;background:var(--surf);color:var(--tx);border:1.5px solid var(--bd);margin-top:8px;font-weight:400;box-shadow:none}
.opt b{display:block;font-weight:700}.opt small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.opt.on{border-color:var(--indigo);background:color-mix(in srgb,var(--indigo) 12%,var(--card))}
:root[data-theme="dark"] .opt.on{border-color:var(--gold);background:rgba(249,223,119,.1)}

.rate{margin-top:10px;padding:11px 13px;border-radius:13px;background:color-mix(in srgb,var(--indigo) 10%,var(--surf));border:1px solid color-mix(in srgb,var(--indigo) 22%,transparent);font-size:14px}
:root[data-theme="dark"] .rate{background:rgba(249,223,119,.1);border-color:rgba(249,223,119,.28)}
:root[data-theme="dark"] .rate b{color:var(--gold)}

.qc{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:var(--sh-sm)}
.qc small{display:block;color:var(--mut);font-size:12px}.qc b{font-size:20px}
.qc button{width:auto;min-width:132px;display:flex;align-items:center;justify-content:center;gap:6px}
.qc.live{border-color:var(--ok);border-width:2px}
.qc .ci{background:linear-gradient(135deg,#179959,#117a45);color:#fff;box-shadow:0 4px 12px rgba(17,122,69,.28)}
.qc .co{background:linear-gradient(135deg,#d93b3b,#b42318);color:#fff;box-shadow:0 4px 12px rgba(180,35,24,.28)}

.adj{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.x{width:34px;min-height:34px;padding:0;background:none;color:var(--bad);border:0;font-size:20px;flex:none;box-shadow:none}

.seg{display:flex;background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{background:none;color:var(--mut);min-height:38px;border-radius:10px;box-shadow:none;font-weight:600}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:0 2px 6px rgba(47,50,115,.12);font-weight:700}
:root[data-theme="dark"] .seg button.on{background:var(--indigo);color:#FFFFFF;box-shadow:0 2px 8px rgba(0,0,0,.28)}

.lnk{display:flex;align-items:center;justify-content:center;background:#1fa855;color:#fff;border-radius:14px;min-height:46px;font-weight:600;text-decoration:none}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ovh{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--bd);background:var(--card)}
.ovh b{font-size:17px}.ovh button{width:auto;min-height:40px;padding:8px 12px;background:none;color:var(--pri);font-weight:700;box-shadow:none}
:root[data-theme="dark"] .ovh button{color:var(--gold)}
.ovb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(28px + env(safe-area-inset-bottom,0px));max-width:620px;width:100%;margin:0 auto}

.lvh{background:linear-gradient(135deg,#2F3273 0%,#4D50A2 100%);color:#fff;border-radius:22px;padding:20px;text-align:center;margin-bottom:6px;box-shadow:0 8px 24px rgba(47,50,115,.26)}
.lvh .yr{display:flex;align-items:center;justify-content:center;gap:18px;font-weight:700;font-size:18px}
.lvh .yb{width:38px;min-height:38px;padding:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;font-size:20px;box-shadow:none}
.lvh .big{display:block;font-size:56px;line-height:1.1;margin-top:6px;color:var(--gold)}
.mh{margin:18px 4px 8px;font-size:12.5px;font-weight:750;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:11px 13px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh-sm)}
.db{width:46px;height:50px;border-radius:13px;background:var(--gold);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.db b{font-size:18px;line-height:1}.db small{font-size:11px;font-weight:700}
.lt{flex:1;min-width:0}.lt b{display:block}.lt small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ch{color:var(--mut);font-size:22px}

.pv{position:fixed;inset:0;z-index:60;background:#FFFFFF;color:#202354;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pvb{flex:none;display:flex;gap:8px;padding:10px;background:#FFFFFF;border-bottom:1px solid #DCDFF2;position:relative;z-index:2}
.pvp{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;max-width:760px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.pv th{background:#F3F4FC;color:#2F3273}.pv th,.pv td{border-bottom:1px solid #DCDFF2;color:#202354}.pv .note{color:#636796}.pv h2{color:#2F3273}.pvs{margin-bottom:6px}.pvs td:last-child{text-align:right}

.pchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}.pchips .chip{width:auto;padding:8px 12px;min-height:40px;font-size:13px;font-weight:600}.pchips .chip small{font-weight:400;opacity:.8}
.toast{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:40;max-width:520px;margin:0 auto;background:var(--navy);color:#FFFFFF;border:1px solid var(--indigo);border-radius:16px;padding:7px 10px 7px 15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 24px rgba(18,20,43,.4)}
.toast button{width:auto;min-height:36px;background:none;color:var(--gold);font-weight:750;padding:6px 14px;box-shadow:none}

.lk{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center}
.lkc{width:100%;max-width:320px;padding:20px;text-align:center}
.dots{display:flex;justify-content:center;gap:14px;margin:20px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--indigo)}
.dots i.f{background:var(--indigo)}
:root[data-theme="dark"] .dots i{border-color:var(--gold)}
:root[data-theme="dark"] .dots i.f{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{min-height:60px;font-size:22px;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:20px;box-shadow:var(--sh-sm)}

.row>*,.grid>*{min-width:0}
input,select,textarea{min-width:0;max-width:100%;display:block}
input[type="date"],input[type="time"],input[type="month"]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;max-width:100%;min-height:46px;line-height:1.2;text-align:left;overflow:hidden}
input[type="date"]::-webkit-date-and-time-value,input[type="time"]::-webkit-date-and-time-value,input[type="month"]::-webkit-date-and-time-value{text-align:left;min-height:1.2em;margin:0}

.cal .sun{background:#FDEAEA;border-color:#EFA8A8;color:#9E2424;font-weight:650}.cal .sun i{font-weight:500}
:root[data-theme="dark"] .cal .sun{background:rgba(255,126,126,.14);border-color:rgba(255,126,126,.38);color:#FFB4B4}
.mcg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:9px 8px;text-align:center}
.mc small{display:block;color:var(--mut);font-size:12px}.mc b{font-size:18px;color:var(--mut)}
.mc.on{border-color:var(--indigo);background:color-mix(in srgb,var(--gold) 35%,var(--card))}
.mc.on b{color:var(--navy)}
:root[data-theme="dark"] .mc.on{border-color:var(--gold);background:rgba(249,223,119,.14)}
:root[data-theme="dark"] .mc.on b{color:var(--gold)}

.lg{display:flex;flex-wrap:wrap;gap:14px;margin:10px 2px 0;font-size:12px;color:var(--mut)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
tr.ot{background:color-mix(in srgb,var(--ok) 11%,transparent)}tr.ot td:first-child{border-left:3px solid var(--ok)}
tr.lv{background:color-mix(in srgb,var(--gold) 24%,transparent)}tr.lv td:first-child{border-left:3px solid #d4a017}
:root[data-theme="dark"] tr.lv{background:rgba(249,223,119,.1)}
:root[data-theme="dark"] tr.lv td:first-child{border-left-color:var(--gold)}
td.otv{color:var(--ok);font-weight:700}
.cal .otd{background:color-mix(in srgb,var(--ok) 13%,var(--card));border-color:var(--ok)}
.cal .lvd{background:color-mix(in srgb,var(--gold) 34%,var(--card));border-color:#d4a017}
:root[data-theme="dark"] .cal .lvd{background:rgba(249,223,119,.14);border-color:var(--gold)}
.pv,.pv *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}.pv td.otv{color:#0b6b3a!important}.pv tr.ot{background:#e2f5ea!important}.pv tr.ot td:first-child{border-left:3px solid #14804A!important}.pv tr.lv{background:#FEF2C0!important}.pv tr.lv td:first-child{border-left:3px solid #d4a017!important}.pv .lg{color:#636796}

.onb{position:fixed;inset:0;z-index:90;background:linear-gradient(135deg,#1E2152 0%,#2F3273 50%,#4D50A2 100%);overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);color:#FFFFFF}
.onb::before{content:"";position:fixed;top:-80px;right:-70px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(249,223,119,.28) 0%,rgba(249,223,119,0) 70%);pointer-events:none;z-index:0}
.onb-bbl{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}

  (r.status==='weekly'&&!r.start?'<p class="note" style="margin:10px 0 0">Weekly holiday. Add start and end time only if you worked this day. It counts as OT by your weekly-holiday rule.</p>':'')+'<label>Status</label><select id="f_s">'+opts+'</select>'+quick()+'<div class="row"><div><label>Start time</label><input type="time" id="f_a" value="'+(r.start||'')+'"></div><div><label>End time</label><input type="time" id="f_b" value="'+(r.end||'')+'"></div></div>'+

function saveRec(){
  var s=$('f_s').value,a=$('f_a').value,b=$('f_b').value;
  if(!editDate){msg=['er','Choose a date.'];return render()}
  if((s==='present')&&(!a||!b)){msg=['er','Enter both start and end time for a present day.'];return render()}
  if((a&&!b)||(!a&&b)){msg=['er','Enter both times or leave both empty.'];return render()}
  if(a&&b&&a===b){msg=['er','Start and end time are identical — check the times.'];return render()}
  var up=!!S.rec[editDate];S.rec[editDate]={date:editDate,status:s,start:(s==='absent'||s==='leave')?'':a,end:(s==='absent'||s==='leave')?'':b,notes:$('f_n').value.trim()};
  save();msg=['ok',up?'Record updated.':'Record saved.'];render()}

    h+='<div class="'+cl+'" onclick="go(\'att\',\''+ds+'\')">'+d+tag+(holName(ds)&&!r?'<i>'+esc(holName(ds))+'</i>':'')+(c.ot>0?'<i class="P">OT '+hrs(c.ot)+'</i>':'')+'</div>'}

      '<p class="dua-bn">আলহামদু লিল্লাহিল্লাযী আহইয়ানা বা&#39;দা মা আমাতানা ওয়া ইলাইহিন নুশুর।</p>'+
      '<p class="dua-mn"><b>অর্থ:</b> সমস্ত প্রশংসা আল্লাহর, যিনি আমাদের মৃত্যুর (ঘুমের) পর জীবিত করেছেন এবং তাঁর কাছেই আমাদের ফিরে যেতে হবে।</p>'+
    '</div>'+
    '<div class="dua-card">'+
      '<h3 class="dua-ttl">২. দরুদ শরীফ</h3>'+
      '<span class="dua-lbl">আরবি</span>'+
      '<div class="dua-ar" dir="rtl" lang="ar">اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ ۩ اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ</div>'+
      '<span class="dua-lbl">বাংলা উচ্চারণ</span>'+
      '<p class="dua-bn">আল্লাহুম্মা সাল্লি আলা মুহাম্মাদিঁউ ওয়া আলা আলি মুহাম্মাদিন কামা সাল্লাইতা আলা ইবরাহিমা ওয়া আলা আলি ইবরাহিমা ইন্নাকা হামিদুম মাজিদ। আল্লাহুম্মা বারিক আলা মুহাম্মাদিঁউ ওয়া আলা আলি মুহাম্মাদিন কামা বারাকতা আলা ইবরাহিমা ওয়া আলা আলি ইবরাহিমা ইন্নাকা হামিদুম মাজিদ।</p>'+
      '<p class="dua-mn"><b>অর্থ:</b> হে আল্লাহ! আপনি মুহাম্মদ (সা.) এবং তাঁর বংশধরদের ওপর রহমত বর্ষণ করুন, যেভাবে আপনি ইবরাহিম (আ.) এবং তাঁর বংশধরদের ওপর রহমত বর্ষণ করেছিলেন। নিশ্চয়ই আপনি প্রশংসিত ও সম্মানিত। হে আল্লাহ! আপনি মুহাম্মদ (সা.) এবং তাঁর বংশধরদের ওপর বরকত দান করুন, যেভাবে আপনি ইবরাহিম (আ.) এবং তাঁর বংশধরদের ওপর বরকত দান করেছিলেন। নিশ্চয়ই আপনি প্রশংসিত ও সম্মানিত।</p>'+
    '</div>'+
    '<div class="dua-act"><button class="dua-pri" onclick="duaNext()">Next →</button></div>';
  }else{
    body='<div class="dua-card">'+
      '<h3 class="dua-ttl">৩. আয়াতুল কুরসি</h3>'+
      '<span class="dua-lbl">আরবি</span>'+
      '<div class="dua-ar" dir="rtl" lang="ar">اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ</div>'+
      '<span class="dua-lbl">বাংলা উচ্চারণ</span>'+
      '<p class="dua-bn">আল্লাহু লা ইলাহা ইল্লা হুওয়াল হাইয়্যুল কাইয়ুম। লা তাখুযুহু সিনাতুওঁ ওয়ালা নাউম। লাহু মা ফিস সামাওয়াতি ওয়ামা ফিল আরদ। মান যাল্লাযী ইয়াশফা&#39;উ ইনদাহু ইল্লা বিইযনিহি। ইয়া&#39;লামু মা বাইনা আইদীহিম ওয়ামা খালফাহুম। ওয়ালা ইউহীতূনা বিশাইইম মিন ইলমিহী ইল্লা বিমা শাআ। ওয়াসি&#39;আ কুরসিয়্যুহুছ সামাওয়াতি ওয়াল আরদা। ওয়ালা ইয়াঊদুহু হিফজুহুমা। ওয়া হুওয়াল আলিয়্যুল আজীম।</p>'+
      '<p class="dua-mn"><b>বাংলা অর্থ:</b> আল্লাহ ছাড়া অন্য কোনো উপাস্য নেই, তিনি জীবিত, সবকিছুর ধারক। তাঁকে তন্দ্রাও স্পর্শ করতে পারে না এবং নিদ্রাও নয়। আসমান ও জমিনে যা কিছু রয়েছে, সবই তাঁর। কে আছে এমন যে সুপারিশ করবে তাঁর কাছে তাঁর অনুমতি ছাড়া? দৃষ্টির সামনে কিংবা পেছনে যা কিছু রয়েছে, সে সবই তিনি জানেন। তাঁর জ্ঞানসীমা থেকে তারা কোনো কিছুকেই পরিবেষ্টিত করতে পারে না, কিন্তু যতটুকু তিনি ইচ্ছা করেন। তাঁর কুরসি (সিংহাসন) সমস্ত আসমান ও জমিনকে পরিবেষ্টিত করে আছে। আর সেগুলোকে ধারণ করা তাঁর পক্ষে কঠিন নয়। তিনিই সর্বোচ্চ এবং সর্বাপেক্ষা মহান।</p>'+
    '</div>'+
    '<div class="dua-act"><button class="dua-sec" onclick="duaBack()">← Back</button><button class="dua-pri" onclick="duaFinish()">Finish ✓</button></div>';
  }
  el.innerHTML='<div class="dua-ov" id="dua_ov">'+DUA_BBL+'<div class="dua-c"><div class="dua-top"><span class="dua-step">ধাপ '+(duaStep===1?'১ / ২':'২ / ২')+'</span><div class="dua-dots"><i class="'+(duaStep===1?'on':'')+'"></i><i class="'+(duaStep===2?'on':'')+'"></i></div></div>'+body+'</div></div>';
  var ov=$('dua_ov');if(ov)ov.scrollTop=0}
function duaNext(){duaStep=2;drawDua()}
function duaBack(){duaStep=1;drawDua()}
function duaFinish(){duaDone=true;drawDua();go('dash')}

S.lock=null;locked=false;render();drawLock();drawDua();
document.addEventListener('visibilitychange',function(){if(document.hidden){hidAt=Date.now()}else if(S.lock&&hidAt&&Date.now()-hidAt>30000){locked=true;pinIn='';lkMsg='';drawLock()}});
</script>
