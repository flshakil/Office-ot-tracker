<!DOCTYPE html>

<style>

:root[data-theme="dark"]{--bg:#0f1319;--card:#181e27;--tx:#eef1f6;--mut:#9aa6b8;--bd:#2a3340;--pri:#6ea0ff;--ok:#4cc48a;--bad:#ff8a80;--hol:#3a2f12;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Noto Sans Bengali","Hind Siliguri",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.k small{color:var(--mut);display:block;font-size:12px}.k b{font-size:18px}
.k.w{grid-column:1/-1}

button{background:var(--pri);color:#fff;border:0;font-weight:600;cursor:pointer}button.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--bad)}

.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left}

.card,.k{border-radius:18px;box-shadow:0 1px 2px rgba(20,30,50,.05)}
button{border-radius:14px}

.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.key{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(20,30,50,.05)}
.bub{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}.bub .ic{width:24px;height:24px}
.key small{color:var(--mut);display:block;font-size:12px}.key b{font-size:21px}
.more{background:var(--card);color:var(--pri);border:1px dashed var(--pri);display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 10px}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px}nav button.on .ic{stroke-width:2.7}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;padding:12px 2px;background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:500}.qa .ic{color:var(--pri)}
h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}h3 .ic{color:var(--pri)}
.theme{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:14px 16px;margin-bottom:12px;text-align:left;font-weight:600}
.theme .tl{display:flex;align-items:center;gap:12px}.theme .tl .ic{width:26px;height:26px;color:var(--pri)}.theme small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.sw{width:56px;height:32px;border-radius:20px;background:var(--bd);position:relative;flex:none;transition:background .2s}.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}.sw.on{background:var(--pri)}.sw.on i{left:27px}
.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0}.chip{padding:10px 0;font-size:13px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);min-height:44px}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.opt{display:block;text-align:left;background:var(--bg);color:var(--tx);border:1.5px solid var(--bd);margin-top:8px;font-weight:400}.opt b{display:block}.opt small{display:block;color:var(--mut);font-size:12px}.opt.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.rate{margin-top:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--pri) 10%,transparent);font-size:14px}
.qc{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,30,50,.05)}.qc small{display:block;color:var(--mut);font-size:12px}.qc b{font-size:20px}.qc button{width:auto;min-width:132px;display:flex;align-items:center;justify-content:center;gap:6px}.qc.live{border-color:#117a45;border-width:2px}.qc .ci{background:#117a45;color:#fff}.qc .co{background:#b42318;color:#fff}
.adj{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.x{width:34px;min-height:34px;padding:0;background:none;color:var(--bad);border:0;font-size:20px;flex:none}.cal i{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero.est{background:linear-gradient(135deg,#0b7a5a,#22b07d)}
.seg{display:flex;background:var(--bd);border-radius:14px;padding:4px;margin-bottom:12px}.seg button{background:none;color:var(--mut);min-height:40px;border-radius:11px}.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.lnk{display:flex;align-items:center;justify-content:center;background:#1fa855;color:#fff;border-radius:14px;min-height:46px;font-weight:600;text-decoration:none}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ovh{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--bd);background:var(--card)}.ovh b{font-size:17px}.ovh button{width:auto;min-height:40px;padding:8px 12px;background:none;color:var(--pri);font-weight:600}
.ovb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(28px + env(safe-area-inset-bottom,0px));max-width:620px;width:100%;margin:0 auto}
.lvh{background:linear-gradient(135deg,#d9730d,#f5a524);color:#fff;border-radius:22px;padding:18px;text-align:center;margin-bottom:6px}.lvh .yr{display:flex;align-items:center;justify-content:center;gap:18px;font-weight:700;font-size:18px}.lvh .yb{width:38px;min-height:38px;padding:0;background:rgba(255,255,255,.24);color:#fff;border-radius:50%;font-size:20px}.lvh .big{display:block;font-size:56px;line-height:1.1;margin-top:6px}
.mh{margin:18px 4px 8px;font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.db{width:46px;height:50px;border-radius:12px;background:color-mix(in srgb,#d9730d 18%,transparent);color:#d9730d;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}.db b{font-size:18px;line-height:1}.db small{font-size:11px;font-weight:600}
.lt{flex:1;min-width:0}.lt b{display:block}.lt small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ch{color:var(--mut);font-size:22px}
.pv{position:fixed;inset:0;z-index:60;background:#fff;color:#000;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
.pvb{display:flex;gap:8px;padding:10px;position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd}.pvp{padding:14px 14px calc(30px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}
.pv th,.pv td{border-bottom:1px solid #ddd;color:#000}.pv .note{color:#555}.pv h2{color:#000}.pvs{margin-bottom:6px}.pvs td:last-child{text-align:right}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}.pchips .chip{width:auto;padding:8px 12px;min-height:40px;font-size:13px;font-weight:600}.pchips .chip small{font-weight:400;opacity:.8}
.toast{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:40;max-width:520px;margin:0 auto;background:#1f2937;color:#fff;border-radius:14px;padding:6px 8px 6px 14px;display:flex;justify-content:space-between;align-items:center}.toast button{width:auto;min-height:38px;background:none;color:#8ab4ff;font-weight:700;padding:6px 14px}
.lk{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center}.lkc{width:100%;max-width:320px;padding:20px;text-align:center}.dots{display:flex;justify-content:center;gap:14px;margin:20px 0}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--pri)}.dots i.f{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pad button{min-height:60px;font-size:22px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px}
.row>*,.grid>*{min-width:0}
input,select,textarea{min-width:0;max-width:100%;display:block}
input[type="date"],input[type="time"],input[type="month"]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;max-width:100%;min-height:46px;line-height:1.2;text-align:left;overflow:hidden}
input[type="date"]::-webkit-date-and-time-value,input[type="time"]::-webkit-date-and-time-value,input[type="month"]::-webkit-date-and-time-value{text-align:left;min-height:1.2em;margin:0}
.cal .sun{background:#fbd3d3;border-color:#e39a9a;color:#9b1c1c;font-weight:600}.cal .sun i{font-weight:500}
:root[data-theme="dark"] .cal .sun{background:#4a1d22;border-color:#7d333a;color:#ffb4ad}
@media print{body.pvon main>*:not(.pv){display:none!important}.pv{position:static!important;overflow:visible!important}nav,.np{display:none!important}body{background:#fff;color:#000}}
</style>

<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="lock" style="display:none"></div>
<script>
var KEY='otv1',DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DEF={salary:0,start:'07:00',end:'15:30',std:8.5,weekly:0,policy:'A',cur:'BDT',tz:'Asia/Dhaka',theme:'dark',themeV:2,lang:'en',late:'offset'};
var S={set:Object.assign({},DEF),rec:{},snap:{},demo:false,adj:[],hol:[],pre:[],skip:[],lock:null},view='dash',editDate='',calYM='',repYM='',msg=null,flt='all',q='',csv='';
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);S.set=Object.assign({},DEF,p.set);if(!(p.set&&p.set.themeV))S.set.theme='dark';S.rec=p.rec||{};S.snap=p.snap||{};S.demo=!!p.demo;S.adj=p.adj||[];S.hol=p.hol||[];S.pre=Array.isArray(p.pre)?p.pre:[];S.skip=Array.isArray(p.skip)?p.skip:[];S.lock=p.lock||null;Object.keys(S.rec).forEach(function(k){if(S.rec[k]&&S.rec[k].status==='absent')S.rec[k].status='leave'})}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){msg=['er','Could not save in this browser.']}}
function today(){return new Date().toLocaleDateString('en-CA',{timeZone:S.set.tz||'Asia/Dhaka'})}
var TODAY=today();calYM=repYM=TODAY.slice(0,7);editDate=TODAY;
function dow(d){return new Date(d+'T00:00:00Z').getUTCDay()}
function mins(t){var a=t.split(':');return +a[0]*60+ +a[1]}
function money(n){return '৳'+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function hrs(n){return (Math.round(n*100)/100).toFixed(2)}
function rate(sal){return sal/30/S.set.std}
function calc(r){
  var z={work:0,ot:0,reg:0,sun:0,oth:0,short:0};
  if(!r||r.status==='absent'||r.status==='leave'||!r.start||!r.end)return z;
  var w=((mins(r.end)-mins(r.start)+1440)%1440)/60,std=S.set.std,ot;
  var wk=r.status==='weekly'||dow(r.date)===+S.set.weekly;
  z.work=w;
  if(wk){z.sun=w;ot=S.set.policy==='A'?w:S.set.policy==='B'?Math.max(w-std,0):0}
  else{ot=Math.max(w-std,0);if(r.status==='custom')z.oth=w;else z.short=Math.max(std-w,0)}
  z.ot=ot;z.reg=w-ot;return z}
function month(ym){
  var list=Object.keys(S.rec).filter(function(d){return d.indexOf(ym)===0}).sort().map(function(d){return S.rec[d]});
  var m={list:list,adj:0,short:0,pot:0,present:0,work:0,reg:0,ot:0,abs:0,leave:0,sun:0,oth:0};
  list.forEach(function(r){var c=calc(r);
    if(r.status==='absent')m.abs++;else if(r.status==='leave')m.leave++;else if(c.work>0||r.status==='present')m.present++;
    m.work+=c.work;m.reg+=c.reg;m.ot+=c.ot;m.short+=c.short;m.sun+=c.sun;m.oth+=c.oth});
  var r0=S.snap[ym]?S.snap[ym].rate:rate(S.set.salary),pl=S.set.late;
  m.pot=pl==='offset'?Math.max(m.ot-m.short,0):m.ot;m.adj=pl==='deduct'?m.short*r0:0;
  return m}
function snapFor(ym){
  if(ym===TODAY.slice(0,7)||!S.snap[ym]&&S.set.salary<=0)return {sal:S.set.salary,rate:rate(S.set.salary),live:true};
  if(!S.snap[ym]){S.snap[ym]={sal:S.set.salary,rate:rate(S.set.salary)};save()}
  return S.snap[ym]}
function ymAdd(ym,n){var a=ym.split('-'),d=new Date(Date.UTC(+a[0],+a[1]-1+n,1));return d.toISOString().slice(0,7)}
function ymName(ym){var a=ym.split('-');return new Date(Date.UTC(+a[0],+a[1]-1,1)).toLocaleString('en-US',{month:'long',year:'numeric',timeZone:'UTC'})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function m12(t){if(!t)return '—';var h=+t.slice(0,2),s=h<12?'AM':'PM';return ((h+11)%12+1)+':'+t.slice(3)+' '+s}
function K(l,v,w){return '<div class="k'+(w?' w':'')+'"><small>'+l+'</small><b>'+v+'</b></div>'}
function M(){var x=msg;msg=null;return x?'<div class="msg '+x[0]+'">'+esc(x[1])+'</div>':''}
function bn(){return S.demo?'<div class="banner">Demo data is loaded — not real records. Clear it in Settings.</div>':''}

var more=false,rmore=false;
var IC={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',att:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 14l2 2 4-4"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',rep:'<path d="M5 20V11M12 20V4M19 20v-6"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2M3 10h18"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6v2M12 16v2"/>',down:'<path d="M6 9l6 6 6-6"/>',up:'<path d="M6 15l6-6 6 6"/>',print:'<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2"/><rect x="6" y="14" width="12" height="7"/>',plus:'<path d="M12 5v14M5 12h14"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',moon:'<path d="M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',in:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',no:'<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>'};
function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}
function key(i,l,v,c){return '<div class="key"><div class="bub" style="background:color-mix(in srgb,'+c+' 16%,transparent);color:'+c+'">'+ic(i)+'</div><div><small>'+l+'</small><b>'+v+'</b></div></div>'}
function stat(i,l,v,c,oc){return '<div class="k"'+(oc?' role="button" tabindex="0" onclick="'+oc+'"':'')+' style="display:flex;flex-direction:column;gap:10px;padding:14px'+(oc?';cursor:pointer':'')+'"><div class="bub" style="width:40px;height:40px;background:color-mix(in srgb,'+c+' 16%,transparent);color:'+c+'">'+ic(i)+'</div><div><small>'+l+'</small><b style="font-size:24px">'+v+'</b>'+(oc?'<small style="margin-top:2px">Tap to see all leave</small>':'')+'</div></div>'}
function nowT(){return new Date().toLocaleTimeString('en-GB',{timeZone:S.set.tz||'Asia/Dhaka',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})}
function ed(){go('att',TODAY)}
function openRec(){var d=today(),r=S.rec[d];if(r&&r.start&&!r.end)return r;var y=new Date(d+'T00:00:00Z');y.setUTCDate(y.getUTCDate()-1);r=S.rec[y.toISOString().slice(0,10)];return r&&r.start&&!r.end?r:null}

function att(){
  var r=S.rec[editDate]||{date:editDate,status:holName(editDate)?'custom':'present',start:S.set.start,end:S.set.end,notes:''},ex=!!S.rec[editDate];
  var opts=[['present','Present'],['leave','Leave'],['weekly','Weekly Holiday'],['custom','Custom Holiday']].map(function(o){return '<option value="'+o[0]+'"'+(r.status===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('');

  '<div class="note">'+DAYS[dow(editDate)]+(dow(editDate)===+S.set.weekly?' · weekly holiday':'')+(holName(editDate)?' · holiday: '+esc(holName(editDate)):'')+(ex?' · editing existing record':' · new record')+'</div>'+
  (r.status==='weekly'&&!r.start?'<p class="note" style="margin:10px 0 0">Weekly holiday. Add start and end time only if you worked this day. It counts as OT by your weekly-holiday rule.</p>':'')+'<label>Status</label><select id="f_s">'+opts+'</select>'+quick()+'<div class="row"><div><label>Start time</label><input type="time" id="f_a" value="'+(r.start||'')+'"></div><div><label>End time</label><input type="time" id="f_b" value="'+(r.end||'')+'"></div></div>'+
  '<label>Notes (optional)</label><textarea id="f_n" rows="2">'+esc(r.notes)+'</textarea>'+
  (ex?'<p class="note">Saved: '+hrs(c.work)+' h worked, '+hrs(c.ot)+' h OT.</p>':'')+

function saveRec(){
  var s=$('f_s').value,a=$('f_a').value,b=$('f_b').value;
  if(!editDate){msg=['er','Choose a date.'];return render()}
  if((s==='present')&&(!a||!b)){msg=['er','Enter both start and end time for a present day.'];return render()}
  if((a&&!b)||(!a&&b)){msg=['er','Enter both times or leave both empty.'];return render()}
  if(a&&b&&a===b){msg=['er','Start and end time are identical — check the times.'];return render()}
  var up=!!S.rec[editDate];S.rec[editDate]={date:editDate,status:s,start:(s==='absent'||s==='leave')?'':a,end:(s==='absent'||s==='leave')?'':b,notes:$('f_n').value.trim()};
  save();msg=['ok',up?'Record updated.':'Record saved.'];render()}

  for(var d=1;d<=dim;d++){var ds=calYM+'-'+(d<10?'0':'')+d,r=S.rec[ds],c=calc(r),cl=(dow(ds)===+S.set.weekly?' sun':'')+(ds===TODAY?' t':'')+(holName(ds)?' sun':'');

    h+='<div class="'+cl+'" onclick="go(\'att\',\''+ds+'\')">'+d+tag+(holName(ds)&&!r?'<i>'+esc(holName(ds))+'</i>':'')+(c.ot>0?'<i class="P">OT '+hrs(c.ot)+'</i>':'')+'</div>'}

function saveSet(){
  grab();var sal=parseFloat(D.salary||'0'),std=parseFloat(D.std);
  if(isNaN(sal)||sal<0){msg=['er','Salary must be a number, 0 or more.'];return render()}
  if(isNaN(std)||std<=0||std>24){msg=['er','Standard hours must be between 0 and 24.'];return render()}
  if(!D.start||!D.end){msg=['er','Office start and end time are required.'];return render()}
  if(+D.weekly!==+S.set.weekly){Object.keys(S.rec).forEach(function(d){var r=S.rec[d];if(r.auto&&!r.start)delete S.rec[d]});S.skip=[]}
  S.set=Object.assign(S.set,{salary:sal,start:D.start,end:D.end,std:std,weekly:+D.weekly,policy:D.policy,late:D.late});
  save();D=null;msg=['ok','Settings saved.'];render();scrollTo(0,0)}

 var y=repY||repYM.slice(0,4),rows='',T={p:0,l:0,ot:0,e:0,est:0,mo:0};
 for(var i=1;i<=12;i++){var ym=y+'-'+(i<10?'0':'')+i,m=month(ym);if(!m.list.some(function(r){return !r.auto}))continue;

function prevRec(){var l=Object.keys(S.rec).filter(function(d){var r=S.rec[d];return d<editDate&&r.start&&r.end}).sort();return l.length?S.rec[l[l.length-1]]:null}

function hp(p){var s='otv1|'+p;if(typeof crypto!=='undefined'&&crypto.subtle&&typeof TextEncoder!=='undefined'){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')})}var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Promise.resolve('d'+h)}

function offPin(){grab();hp($('k_o').value).then(function(h){if(S.lock&&h===S.lock.h){S.lock=null;save();flash(['ok','App lock is off.'])}else flash(['er','Wrong PIN.'])})}

function trs(t){if(!BNRE){var ks=Object.keys(BN).sort(function(a,b){return b.length-a.length}).map(function(k){return k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')});BNRE=new RegExp('(^|[^A-Za-z])('+ks.join('|')+')(?![A-Za-z])','g')}
 t=t.replace(BNRE,function(m,p,k){return p+BN[k]});
 t=t.replace(/(\d)(\.\d+)? h(?![A-Za-z])/g,'$1$2 ঘণ্টা');
 return t.replace(/\d/g,function(d){return '০১২৩৪৫৬৭৮৯'.charAt(d)})}
function tr(root){if(!root)return;var w=document.createTreeWalker(root,4,null),n,L=[];
 while(n=w.nextNode()){var q=n.parentNode.nodeName;if(q!=='TEXTAREA'&&q!=='SCRIPT'&&q!=='STYLE')L.push(n)}
 L.forEach(function(n){var v=trs(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});
 root.querySelectorAll('[placeholder]').forEach(function(e){e.setAttribute('placeholder',trs(e.getAttribute('placeholder')))})}

  if(!confirm('Replace all current data with this backup ('+n+' records)?'))return;
  S.set=Object.assign({},DEF,p.set);S.set.salary=Math.max(0,+S.set.salary||0);if(!(S.set.std>0&&S.set.std<=24))S.set.std=8.5;
  S.rec=ok;S.snap=(p.snap&&typeof p.snap==='object')?p.snap:{};S.adj=(Array.isArray(p.adj)?p.adj:[]).filter(function(a){return a&&/^\d{4}-\d\d-\d\d$/.test(a.date)&&(a.type==='advance'||a.type==='deduction')&&+a.amount>0}).map(function(a){return {id:+a.id||Date.now()+Math.floor(Math.random()*1e6),date:a.date,type:a.type,amount:+a.amount,note:String(a.note||'')}});S.hol=(Array.isArray(p.hol)?p.hol:[]).filter(function(h){return h&&/^\d{4}-\d\d-\d\d$/.test(h.date)}).map(function(h){return {date:h.date,name:String(h.name||'Holiday')}});holSort();S.skip=(Array.isArray(p.skip)?p.skip:[]).filter(function(x){return /^\d{4}-\d\d-\d\d$/.test(x)});S.pre=(Array.isArray(p.pre)?p.pre:[]).filter(function(x){return x&&x.name&&T.test(x.start)&&T.test(x.end)}).slice(0,8).map(function(x){return {name:String(x.name),start:x.start,end:x.end}});S.demo=false;D=null;bk='';save();msg=['ok','Backup restored: '+n+' records.'];render();scrollTo(0,0)}
function delAll(){var t=$('del_t');if(!t||t.value.trim()!=='DELETE'){grab();msg=['er','Type DELETE exactly to confirm.'];return render()}
  S.rec={};S.snap={};S.demo=false;S.set=Object.assign({},DEF);D=null;bk='';S.adj=[];S.hol=[];S.pre=[];S.skip=[];save();msg=['ok','All data deleted.'];render();scrollTo(0,0)}
function demo(){
  if(!confirm('Add demo records for this month? They are not real data.'))return;
  var ym=TODAY.slice(0,7),n=+TODAY.slice(8),ends=['15:30','16:30','17:30','15:30'];
  for(var d=1;d<=n;d++){var ds=ym+'-'+(d<10?'0':'')+d;if(S.rec[ds])continue;if(dow(ds)===+S.set.weekly)continue;
    S.rec[ds]={date:ds,status:'present',start:'07:00',end:ends[d%4],notes:'demo'}}
  if(!S.set.salary)S.set.salary=29000;S.demo=true;D=null;save();msg=['ok','Demo data added.'];render()}
function clearAll(){if(confirm('Delete ALL records and settings in this preview?')){D=null;S.rec={};S.snap={};S.demo=false;S.set=Object.assign({},DEF);save();msg=['ok','Everything cleared.'];render()}}

function ensureWeekly(){
 var t=today(),ks=Object.keys(S.rec).filter(function(d){return !S.rec[d].auto}).sort(),from=ks.length?ks[0]:t.slice(0,7)+'-01',d=new Date(from+'T00:00:00Z'),e=new Date(t+'T00:00:00Z'),ch=false;
 if((e-d)/864e5>400)d=new Date(e.getTime()-400*864e5);
 while(d<=e){var ds=d.toISOString().slice(0,10);
  if(dow(ds)===+S.set.weekly&&!S.rec[ds]&&S.skip.indexOf(ds)<0){S.rec[ds]={date:ds,status:'weekly',start:'',end:'',notes:'',auto:true};ch=true}
  d.setUTCDate(d.getUTCDate()+1)}
 if(ch)save()}
